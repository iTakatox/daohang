<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目导航</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  :root {
    --bg: #f8f9fb;
    --text: #1e1e2e;
    --muted: #8b8fa3;
    --accent: #5b5fe3;
    --accent2: #8b5cf6;
    --card: #ffffff;
    --radius: 18px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Hero ── */
  .hero {
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #4338ca 100%);
    padding: 56px 24px 64px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 20% 50%, rgba(139,92,246,0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(99,102,241,0.2) 0%, transparent 50%);
    pointer-events: none;
  }
  .hero-content { position: relative; z-index: 1; }
  .hero h1 {
    font-size: 38px; font-weight: 800; color: #ffffff;
    letter-spacing: -1px; margin-bottom: 10px;
  }
  .hero h1 span { background: linear-gradient(135deg, #c4b5fd, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hero p { font-size: 15px; color: #a5b4fc; opacity: 0.85; }

  .stats-row {
    display: flex; justify-content: center; gap: 32px;
    margin-top: 32px; position: relative; z-index: 1;
  }
  .stat-item { text-align: center; }
  .stat-num {
    font-size: 40px; font-weight: 800; color: #ffffff;
    line-height: 1;
  }
  .stat-tag { font-size: 12px; color: #a5b4fc; margin-top: 4px; letter-spacing: 1px; }

  /* ── Grid ── */
  .container { max-width: 1024px; margin: 0 auto; padding: 40px 24px 60px; }

  .section-title {
    font-size: 13px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 2px;
    margin-bottom: 20px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 18px;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px 26px 24px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.04);
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
    text-decoration: none; color: inherit; display: flex;
    flex-direction: column; gap: 10px;
    border: 1px solid #f1f1f4;
    position: relative; overflow: hidden;
  }
  .card::after {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.3s ease;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 36px rgba(0,0,0,0.08); border-color: #e4e4ec; }
  .card:hover::after { transform: scaleX(1); }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .card-icon {
    width: 48px; height: 48px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }
  .card-arrow {
    font-size: 14px; color: #c0c0d0;
    transition: all 0.3s;
  }
  .card:hover .card-arrow { color: var(--accent); transform: translateX(3px); }

  .card-info { flex: 1; }
  .card-name { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
  .card-domain { font-size: 12px; color: #b0b4c0; margin-top: 2px; }

  .card-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .tag {
    font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
    padding: 3px 10px; border-radius: 100px;
  }
  .tag-html { background: #fef3c7; color: #b45309; }
  .tag-flask { background: #e0e7ff; color: #4338ca; }
  .tag-render { background: #d1fae5; color: #065f46; }

  /* ── Footer ── */
  .footer {
    text-align: center; padding: 20px 24px 40px;
    font-size: 12px; color: #c0c4d0; letter-spacing: 0.5px;
  }

  @media (max-width: 768px) {
    .hero { padding: 48px 20px 52px; }
    .hero h1 { font-size: 28px; }
    .hero p { font-size: 13px; }
    .stats-row { gap: 24px; margin-top: 24px; }
    .stat-num { font-size: 32px; }
    .stat-tag { font-size: 11px; }

    .container { padding: 24px 16px 40px; }
    .section-title { font-size: 11px; margin-bottom: 14px; }

    .grid { grid-template-columns: 1fr; gap: 12px; }

    .card {
      padding: 20px 18px;
      gap: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .card:active {
      transform: scale(0.98);
      background: #f8f8fc;
    }
    .card-icon { width: 42px; height: 42px; border-radius: 12px; font-size: 21px; }
    .card-name { font-size: 15px; }
    .card-domain { font-size: 11px; }
    .card-arrow { font-size: 16px; }

    .footer { padding: 12px 16px 32px; font-size: 11px; }
  }

  @media (max-width: 380px) {
    .hero { padding: 36px 14px 40px; }
    .hero h1 { font-size: 24px; }
    .stats-row { gap: 16px; }
    .stat-num { font-size: 26px; }
    .stat-tag { font-size: 10px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-content">
    <h1>我的<span>项目</span>导航</h1>
    <p>一站式入口，快速访问所有业务工具</p>
  </div>
  <div class="stats-row">
    <div class="stat-item"><div class="stat-num" id="totalCount">8</div><div class="stat-tag">项目总数</div></div>
    <div class="stat-item"><div class="stat-num" id="htmlCount">4</div><div class="stat-tag">静态页面</div></div>
    <div class="stat-item"><div class="stat-num" id="flaskCount">4</div><div class="stat-tag">Flask 应用</div></div>
  </div>
</div>

<div class="container">
  <div class="section-title">全部项目</div>
  <div class="grid" id="grid"></div>
</div>

<div class="footer">iTakatox · 2026</div>

<script>
const projects = [
  { name: "厂检报告", icon: "📋", color: "#fef3c7", url: "https://changjian.onrender.com", domain: "changjian.onrender.com", type: "html" },
  { name: "二维码",   icon: "📱", color: "#e0f2fe", url: "https://erweima-g2e5.onrender.com", domain: "erweima-g2e5.onrender.com", type: "html" },
  { name: "水量计算", icon: "💧", color: "#dcfce7", url: "https://shuiliang.onrender.com", domain: "shuiliang.onrender.com", type: "html" },
  { name: "数据分析", icon: "📊", color: "#fce7f3", url: "https://fxgongju.onrender.com", domain: "fxgongju.onrender.com", type: "html" },
  { name: "订单制作", icon: "📦", color: "#e0e7ff", url: "https://dingdan.onrender.com", domain: "dingdan.onrender.com", type: "flask" },
  { name: "工伤费率", icon: "🏥", color: "#fef9c3", url: "https://gsfl.onrender.com", domain: "gsfl.onrender.com", type: "flask" },
  { name: "对账管理", icon: "💰", color: "#d1fae5", url: "https://zd-2h6z.onrender.com", domain: "zd-2h6z.onrender.com", type: "flask" },
  { name: "销售单",   icon: "🔍", color: "#ffe4e6", url: "https://recon-system-cr7r.onrender.com", domain: "recon-system-cr7r.onrender.com", type: "flask" },
];

const typeLabel = { html: "静态页", flask: "Flask" };
const typeTag  = { html: "tag-html", flask: "tag-flask" };

document.getElementById('totalCount').textContent = projects.length;
document.getElementById('htmlCount').textContent = projects.filter(p => p.type === 'html').length;
document.getElementById('flaskCount').textContent = projects.filter(p => p.type === 'flask').length;

document.getElementById('grid').innerHTML = projects.map(p => `
  <a class="card" href="${p.url}" target="_blank">
    <div class="card-top">
      <div class="card-icon" style="background:${p.color}">${p.icon}</div>
      <span class="card-arrow">↗</span>
    </div>
    <div class="card-info">
      <div class="card-name">${p.name}</div>
      <div class="card-domain">${p.domain}</div>
      <div class="card-tags">
        <span class="tag ${typeTag[p.type]}">${typeLabel[p.type]}</span>
      </div>
    </div>
  </a>
`).join('');
</script>
</body>
</html>
