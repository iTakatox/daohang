<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>项目导航</title>
<meta name="description" content="一站式项目导航，快速访问所有业务工具">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas:    #faf9f8;
    --surface:   #ffffff;
    --ink:       #1c1917;
    --muted:     #78716c;
    --accent:    #0f766e;
    --accent-bg: #f0fdfa;
    --border:    #e7e5e4;
    --hero-bg:   #0b1120;
    --hero-text: #f1f5f9;
    --radius:    20px;
    --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "Geist Mono", "SF Mono", "Cascadia Code", monospace;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-sans);
    background: var(--canvas);
    color: var(--ink);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Noise texture ── */
  .noise {
    position: fixed; inset: 0; z-index: 9999;
    pointer-events: none; opacity: 0.028;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 256px 256px;
  }

  /* ── Skip link ── */
  .skip-link {
    position: fixed; top: 12px; left: 12px; z-index: 10000;
    background: var(--accent); color: #fff;
    padding: 8px 16px; border-radius: 8px;
    font-size: 13px; font-weight: 600;
    transform: translateY(-130%);
    transition: transform 0.25s ease;
  }
  .skip-link:focus { transform: translateY(0); outline: 2px solid #5eead4; outline-offset: 2px; }

  /* ════ Hero ════ */
  .hero {
    background: var(--hero-bg);
    padding: clamp(48px, 10vw, 88px) clamp(20px, 6vw, 64px);
    position: relative; overflow: hidden; isolation: isolate;
  }
  .hero::before {
    content: "";
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 55% 50% at 10% 35%, rgba(15,118,110,0.13) 0%, transparent 55%),
      radial-gradient(ellipse 45% 65% at 80% 70%, rgba(15,118,110,0.05) 0%, transparent 50%);
  }
  /* Subtle diagonal line pattern */
  .hero::after {
    content: "";
    position: absolute; inset: 0; z-index: 0; opacity: 0.18;
    background: repeating-linear-gradient(
      105deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.03) 2px,
      rgba(255,255,255,0.03) 3px
    );
  }
  .hero-content {
    position: relative; z-index: 1;
    max-width: 1040px;
  }
  .hero-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 11px; font-weight: 500;
    letter-spacing: 2px;
    color: #5eead4;
    margin-bottom: 20px;
  }
  .hero h1 {
    font-family: var(--font-sans);
    font-size: clamp(36px, 7vw, 60px);
    font-weight: 400; color: var(--hero-text);
    letter-spacing: -0.02em; line-height: 1.06;
    text-wrap: balance; margin-bottom: 16px;
  }
  .hero h1 strong { font-weight: 800; color: #ffffff; }
  .hero p {
    font-size: 16px; color: #94a3b8;
    max-width: 440px; line-height: 1.55;
  }

  /* ── Stats ── */
  .stats-row {
    display: flex; gap: clamp(24px, 6vw, 48px);
    margin-top: 42px;
    position: relative; z-index: 1;
  }
  .stat-item { display: flex; flex-direction: column; }
  .stat-num {
    font-family: var(--font-mono);
    font-size: clamp(32px, 5vw, 44px);
    font-weight: 600; color: #ffffff;
    line-height: 1; font-variant-numeric: tabular-nums;
  }
  .stat-tag {
    font-size: 11px; color: #64748b;
    margin-top: 4px; letter-spacing: 0.4px;
    font-weight: 500;
  }

  /* ════ Main ════ */
  .container {
    max-width: 1040px; margin: 0 auto;
    padding: clamp(32px, 6vw, 52px) clamp(16px, 4vw, 32px) 60px;
  }
  .section-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 24px; flex-wrap: wrap; gap: 8px;
  }
  .section-title {
    font-family: var(--font-mono);
    font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1.5px;
  }
  .section-count {
    font-family: var(--font-mono);
    font-size: 11px; color: #a8a29e; font-variant-numeric: tabular-nums;
  }

  /* ── 2-col Zig-Zag Grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  /* Zig-zag: right-column cards offset down */
  .grid .card:nth-child(even) { margin-top: 28px; }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 22px 22px 20px 20px;
    text-decoration: none; color: inherit;
    display: flex; align-items: center; gap: 16px;
    border: 1px solid var(--border);
    position: relative; overflow: hidden;
    transition:
      transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
      box-shadow 0.4s ease,
      border-color 0.4s ease,
      background 0.4s ease;
    box-shadow: 0 1px 2px rgba(28,25,23,0.03);
    opacity: 0; transform: translateY(20px);
    animation: cardIn 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    -webkit-tap-highlight-color: transparent;
  }
  @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
  .card:nth-child(1) { animation-delay: 0.04s; }
  .card:nth-child(2) { animation-delay: 0.08s; }
  .card:nth-child(3) { animation-delay: 0.12s; }
  .card:nth-child(4) { animation-delay: 0.16s; }
  .card:nth-child(5) { animation-delay: 0.20s; }
  .card:nth-child(6) { animation-delay: 0.24s; }
  .card:nth-child(7) { animation-delay: 0.28s; }
  .card:nth-child(8) { animation-delay: 0.32s; }

  /* Left accent rail on hover */
  .card::before {
    content: "";
    position: absolute; left: 0; top: 14px; bottom: 14px;
    width: 3px; border-radius: 0 3px 3px 0;
    background: var(--accent);
    transform: scaleY(0);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(15,118,110,0.04), 0 10px 28px rgba(15,118,110,0.08); border-color: #99f6e4; background: #fafefc; }
  .card:hover::before { transform: scaleY(1); }
  .card:active { transform: scale(0.985); transition: transform 0.08s ease; }

  /* ── Card badge (Chinese character icon) ── */
  .card-badge {
    width: 44px; height: 44px; min-width: 44px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700;
    font-family: var(--font-sans);
    color: var(--accent);
    letter-spacing: 0;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .card:hover .card-badge { transform: scale(1.06); }

  /* ── Card body ── */
  .card-body { flex: 1; min-width: 0; }
  .card-name {
    font-size: 16px; font-weight: 700; color: var(--ink);
    letter-spacing: -0.2px; margin-bottom: 1px;
  }
  .card-domain {
    font-size: 12px; color: #a8a29e; margin-bottom: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 10px; font-weight: 500; letter-spacing: 0.3px;
    padding: 2px 10px; border-radius: 5px;
  }
  .tag-static { background: #fef3c7; color: #92400e; }
  .tag-flask  { background: #e0e7ff; color: #3730a3; }

  /* ── Arrow ── */
  .card-arrow {
    font-family: var(--font-mono);
    font-size: 15px; color: #d6d3d1; font-weight: 500;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    flex-shrink: 0;
  }
  .card:hover .card-arrow { color: var(--accent); transform: translate(2px, -2px); }

  /* ── Footer ── */
  .footer {
    text-align: center; padding: 12px 24px 36px;
    font-family: var(--font-mono);
    font-size: 11px; color: #d6d3d1; letter-spacing: 0.2px;
    font-weight: 500;
  }

  /* ════ Mobile ════ */
  @media (max-width: 768px) {
    .grid {
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .grid .card:nth-child(even) { margin-top: 0; }

    .card {
      padding: 16px; gap: 12px;
      animation: none; opacity: 1; transform: none;
    }
    .card-badge {
      width: 38px; height: 38px; min-width: 38px;
      border-radius: 12px; font-size: 18px;
    }
    .card-name { font-size: 15px; }
    .card-domain { font-size: 11px; }
    .card-arrow { font-size: 16px; }

    .hero-label { font-size: 10px; margin-bottom: 16px; }
    .hero h1 { font-size: 32px; }
    .hero p { font-size: 14px; }
    .stats-row { gap: 24px; margin-top: 32px; }

    .container { padding-bottom: 44px; }
    .section-title { font-size: 11px; }

    .footer { padding: 8px 14px 28px; font-size: 10px; }
  }

  @media (max-width: 380px) {
    .hero h1 { font-size: 26px; }
    .hero p { font-size: 13px; }
    .stats-row { gap: 18px; }
    .stat-num { font-size: 28px; }
    .stat-tag { font-size: 10px; }
    .card-badge { width: 34px; height: 34px; min-width: 34px; font-size: 16px; }
    .card { padding: 14px; gap: 10px; }
  }
</style>
</head>
<body>

<a href="#grid" class="skip-link">跳转到项目列表</a>
<div class="noise" aria-hidden="true"></div>

<!-- ════ Hero — left-aligned, no badge, no gradient text ════ -->
<header class="hero">
  <div class="hero-content">
    <span class="hero-label">NAVIGATION</span>
    <h1>我的<strong>项目</strong>导航</h1>
    <p>一站式入口，快速访问所有业务工具与数据面板</p>
    <div class="stats-row">
      <div class="stat-item">
        <div class="stat-num" id="totalCount">8</div>
        <div class="stat-tag">项目总数</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="htmlCount">4</div>
        <div class="stat-tag">静态页面</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="flaskCount">4</div>
        <div class="stat-tag">Flask 应用</div>
      </div>
    </div>
  </div>
</header>

<!-- ════ Project cards — 2-col zig-zag ════ -->
<main class="container">
  <div class="section-header">
    <h2 class="section-title">全部项目</h2>
    <span class="section-count" id="projectCount">共 8 个项目</span>
  </div>
  <div class="grid" id="grid"></div>
</main>

<footer class="footer">iTakatox &middot; 2026</footer>

<script>
// Each project uses its first Chinese character as badge icon (no emojis)
const projects = [
  { name: "厂检报告", char: "厂", bg: "#fef3c7", url: "https://changjian.onrender.com", domain: "changjian.onrender.com", type: "static" },
  { name: "二维码",   char: "码", bg: "#e0f2fe", url: "https://erweima-g2e5.onrender.com", domain: "erweima-g2e5.onrender.com", type: "static" },
  { name: "水量计算", char: "水", bg: "#dcfce7", url: "https://shuiliang.onrender.com", domain: "shuiliang.onrender.com", type: "static" },
  { name: "数据分析", char: "数", bg: "#fce7f3", url: "https://fxgongju.onrender.com", domain: "fxgongju.onrender.com", type: "static" },
  { name: "订单制作", char: "单", bg: "#e0e7ff", url: "https://dingdan.onrender.com", domain: "dingdan.onrender.com", type: "flask" },
  { name: "工伤费率", char: "伤", bg: "#fef9c3", url: "https://gsfl.onrender.com", domain: "gsfl.onrender.com", type: "flask" },
  { name: "对账管理", char: "账", bg: "#d1fae5", url: "https://zd-2h6z.onrender.com", domain: "zd-2h6z.onrender.com", type: "flask" },
  { name: "销售单",   char: "售", bg: "#ffe4e6", url: "https://recon-system-cr7r.onrender.com", domain: "recon-system-cr7r.onrender.com", type: "flask" },
];

const typeLabel = { static: "静态页", flask: "Flask" };
const typeTagClass = { static: "tag-static", flask: "tag-flask" };

document.getElementById('totalCount').textContent = projects.length;
document.getElementById('htmlCount').textContent  = projects.filter(p => p.type === 'static').length;
document.getElementById('flaskCount').textContent = projects.filter(p => p.type === 'flask').length;
document.getElementById('projectCount').textContent = '共 ' + projects.length + ' 个项目';

document.getElementById('grid').innerHTML = projects.map(p => `
  <a class="card" href="${p.url}" target="_blank" rel="noopener">
    <div class="card-badge" style="background:${p.bg}" aria-hidden="true">${p.char}</div>
    <div class="card-body">
      <div class="card-name">${p.name}</div>
      <div class="card-domain">${p.domain}</div>
      <span class="tag ${typeTagClass[p.type]}">${typeLabel[p.type]}</span>
    </div>
    <span class="card-arrow" aria-hidden="true">&rarr;</span>
  </a>
`).join('');
</script>
</body>
</html>
